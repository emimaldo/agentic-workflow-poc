version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agentic_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Agentic_P0C_Secret!
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql_data: