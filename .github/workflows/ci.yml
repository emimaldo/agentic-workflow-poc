name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test (.NET 10, zero-token + SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Fails the build if any direct or transitive package has a known vulnerability.
      - name: Restore (NuGet audit as errors)
        run: >
          dotnet restore AgenticWorkflowPoC.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          "-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904"

      - name: Build (warnings as errors)
        run: dotnet build AgenticWorkflowPoC.sln --no-restore -c Release -warnaserror

      # Zero-token suite (FakeChatClient) plus SQL Server 2022 via Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: >
          dotnet test AgenticWorkflowPoC.sln --no-build -c Release
          --logger GitHubActions
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
